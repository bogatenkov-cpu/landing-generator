<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Landing Generator — Tranio</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:#1a2a2a;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar__logo{padding:24px 20px 16px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#bfa177;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar__new{margin:16px;padding:10px 16px;background:#bfa177;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;width:calc(100% - 32px);text-align:center}
.sidebar__new:hover{background:#a8895f}
.sidebar__list{flex:1;overflow-y:auto;padding:8px 0}
.sidebar__item{padding:10px 20px;font-size:13px;cursor:pointer;color:rgba(255,255,255,.7);border-left:3px solid transparent;transition:.15s}
.sidebar__item:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar__item.active{background:rgba(191,161,119,.15);color:#bfa177;border-left-color:#bfa177}
.sidebar__item-name{font-weight:500}
.sidebar__item-slug{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.sidebar__empty{padding:20px;font-size:12px;color:rgba(255,255,255,.3);text-align:center}
.sidebar__divider{border-top:1px solid rgba(255,255,255,.08);margin:8px 0 0}
.sidebar__section-label{padding:10px 20px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.sidebar__list--demos .sidebar__item{color:rgba(255,255,255,.5)}
.sidebar__list--demos .sidebar__item-slug{color:rgba(255,255,255,.25)}
.sidebar__list--demos .sidebar__item .sidebar__demo-badge{display:inline-block;font-size:9px;padding:1px 5px;background:rgba(191,161,119,.25);color:#c9a96e;border-radius:3px;margin-left:6px;vertical-align:middle}

/* Main */
.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar__title{font-size:15px;font-weight:600;color:#111}
.topbar__actions{display:flex;gap:10px;align-items:center}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:.15s}
.btn-outline{background:transparent;border:1.5px solid #d1d5db;color:#444}
.btn-outline:hover{border-color:#9ca3af;color:#111}
.btn-primary{background:#2f5050;color:#fff}
.btn-primary:hover{background:#253f3f}
.btn-gold{background:#bfa177;color:#fff}
.btn-gold:hover{background:#a8895f}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Form */
.content{padding:32px;flex:1}
.welcome{text-align:center;padding:80px 40px;color:#9ca3af}
.welcome h2{font-size:24px;color:#374151;margin-bottom:12px}
.welcome p{font-size:14px;line-height:1.6}

.form-sections{display:flex;flex-direction:column;gap:24px;max-width:900px}
.section-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden}
.section-card__header{padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.section-card__title{font-size:14px;font-weight:600;color:#111;display:flex;align-items:center;gap:8px}
.section-card__chevron{font-size:12px;color:#9ca3af;transition:transform .2s}
.section-card.collapsed .section-card__chevron{transform:rotate(-90deg)}
.section-card__body{padding:20px;display:flex;flex-direction:column;gap:16px}
.section-card.collapsed .section-card__body{display:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:#2f5050}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Dynamic lists */
.dyn-list{display:flex;flex-direction:column;gap:8px}
.dyn-item{display:flex;gap:8px;align-items:flex-start}
.dyn-item input,.dyn-item textarea{flex:1}
.dyn-item .btn-rm{padding:8px 10px;background:#fee2e2;color:#dc2626;border:none;border-radius:6px;cursor:pointer;font-size:14px;flex-shrink:0;line-height:1}
.dyn-item .btn-rm:hover{background:#fecaca}
.btn-add{padding:8px 14px;background:#f0f9ff;color:#0369a1;border:1.5px dashed #bae6fd;border-radius:8px;font-size:13px;cursor:pointer;align-self:flex-start}
.btn-add:hover{background:#e0f2fe}

/* Layout/ROI sub-cards */
.sub-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sub-card__header{display:flex;justify-content:space-between;align-items:center}
.sub-card__title{font-size:13px;font-weight:600;color:#374151}

/* Status */
.status{padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.status.show{display:block}
.status-ok{background:#dcfce7;color:#166534}
.status-err{background:#fee2e2;color:#991b1b}
.status-info{background:#dbeafe;color:#1e40af}

/* Deploy result */
.deploy-result{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-top:20px;display:none}
.deploy-result.show{display:block}
.deploy-result h4{font-size:14px;font-weight:600;margin-bottom:12px}
.deploy-result a{color:#2f5050;font-weight:500}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.preview-frame{width:100%;height:100vh;border:none;display:none}

/* Image field with upload */
.img-input-wrap{display:flex;gap:8px;align-items:center}
.img-input-wrap input{flex:1;min-width:0}
.btn-upload{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;font-size:12px;font-weight:500;color:#374151;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.15s;line-height:1}
.btn-upload:hover{background:#f3f4f6;border-color:#9ca3af}
.btn-upload input[type=file]{display:none}

/* AI Fill */
.ai-bar{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;gap:10px;align-items:center}
.ai-bar input{flex:1;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.ai-bar input:focus{border-color:#7c3aed}
.btn-ai{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-ai:hover{background:linear-gradient(135deg,#6d28d9,#5b21b6)}
.btn-ai:disabled{opacity:.6;cursor:not-allowed}
.ai-status{font-size:12px;color:#6b7280;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-drive{background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-drive:hover{background:linear-gradient(135deg,#1557b0,#0d47a1)}
.btn-drive:disabled{opacity:.6;cursor:not-allowed}

/* Drive import modal */
.drive-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.7);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(4px)}
.drive-modal{background:#fff;border-radius:16px;padding:32px;width:560px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.drive-modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
.drive-modal p{font-size:13px;color:#6b7280;margin-bottom:16px;line-height:1.5}
.drive-modal .field{margin-bottom:16px}
.drive-modal label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.drive-modal input{width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box}
.drive-modal input:focus{border-color:#1a73e8}
.drive-modal .naming-guide{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:16px}
.drive-modal .naming-guide h4{font-size:13px;font-weight:700;margin-bottom:8px;color:#1e293b}
.drive-modal .naming-guide table{width:100%;font-size:12px;border-collapse:collapse}
.drive-modal .naming-guide td{padding:3px 8px;border-bottom:1px solid #f1f5f9}
.drive-modal .naming-guide td:first-child{font-weight:600;color:#1a73e8;white-space:nowrap;width:40%}
.drive-modal .naming-guide td:last-child{color:#64748b}
.drive-modal .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.drive-modal .btn-cancel{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer}
.drive-modal .result-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px;margin-top:16px}
.drive-modal .result-box.error{background:#fef2f2;border-color:#fecaca}
.drive-modal .result-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.drive-modal .result-item:last-child{border-bottom:none}
.drive-modal .result-item .role{font-weight:600;color:#059669;min-width:120px}
.drive-modal .result-item .fname{color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis}
.drive-modal .result-item img{width:48px;height:36px;object-fit:cover;border-radius:4px;flex-shrink:0}

.img-thumb{margin-top:6px;border-radius:8px;overflow:hidden;max-height:110px;display:none}
.img-thumb img{width:100%;max-height:110px;object-fit:cover;display:block}
.img-thumb.visible{display:block}

/* Login overlay */
.login-overlay{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(6px)}
.login-box{background:#fff;border-radius:16px;padding:48px 40px;width:340px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-box h2{font-size:22px;font-weight:700;color:#111;margin-bottom:6px}
.login-box p{color:#6b7280;font-size:13px;margin-bottom:28px}
.login-box input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.login-box input[type=password]:focus{border-color:#2f5050}
.login-box .btn-signin{width:100%;padding:11px;background:#2f5050;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box .btn-signin:hover{background:#253f3f}
.login-err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}

/* Editor language switcher */
.editor-lang-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#f8f9fa;border-bottom:1px solid #e5e7eb;border-radius:8px;margin-bottom:16px}
.editor-lang-bar__label{font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
.editor-lang-bar__btns{display:flex;gap:0;border:1.5px solid #e5e7eb;border-radius:6px;overflow:hidden}
.editor-lang-btn{padding:6px 16px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:#fff;color:#6b7280;transition:.15s}
.editor-lang-btn:not(:last-child){border-right:1px solid #e5e7eb}
.editor-lang-btn.active{background:#2f5050;color:#fff}
.editor-lang-btn:hover:not(.active){background:#f3f4f6}

/* Checkbox row */
.checkbox-row{display:flex;gap:16px;align-items:center}
.checkbox-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;text-transform:none;letter-spacing:0}
.checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer}

/* Form field editor rows */
.ff-row{display:grid;grid-template-columns:1fr 100px 1fr 60px 40px;gap:8px;align-items:center}
.ff-row input,.ff-row select{padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:13px}
.ff-row label{font-size:12px;display:flex;align-items:center;gap:4px;justify-content:center}

/* Template picker */
.template-picker{margin-bottom:16px}
.template-picker__title{font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.template-picker__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.template-card{border:2px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;transition:.2s;background:#fff}
.template-card:hover{border-color:#bfa177;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.template-card.active{border-color:#2f5050;box-shadow:0 0 0 2px rgba(47,80,80,.2)}
.template-card__swatches{display:flex;gap:4px;margin-bottom:8px}
.template-card__swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.1)}
.template-card__name{font-size:13px;font-weight:600;color:#1f2937}
.template-card__desc{font-size:11px;color:#6b7280;margin-top:2px}
@media(max-width:900px){.template-picker__grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar__logo">Landing Generator</div>
    <button class="sidebar__new" onclick="newProject()">+ New Project</button>
    <div class="sidebar__list" id="projectList">
      <div class="sidebar__empty">Loading...</div>
    </div>
    <div class="sidebar__divider"></div>
    <div class="sidebar__section-label">Examples</div>
    <div class="sidebar__list sidebar__list--demos" id="demoList">
      <div class="sidebar__empty">Loading...</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainArea">
    <div class="topbar">
      <div class="topbar__title" id="topbarTitle">Select or create a project</div>
      <div class="topbar__actions" id="topbarActions" style="display:none">
        <button class="btn btn-outline" onclick="previewProject()">Preview</button>
        <button class="btn btn-primary" onclick="saveProject()">Save</button>
        <button class="btn btn-gold" id="deployBtn" onclick="deployProject()">Deploy</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="welcome">
        <h2>Welcome to Landing Generator</h2>
        <p>Create or select a project from the sidebar.<br>Fill in the data, preview, and deploy with one click.</p>
      </div>
    </div>
    <iframe class="preview-frame" id="previewFrame"></iframe>
  </div>

</div>

<!-- Login overlay -->
<div id="loginOverlay" class="login-overlay" style="display:none">
  <div class="login-box">
    <h2>Landing Generator</h2>
    <p>Tranio Thailand — enter admin password</p>
    <input type="password" id="loginPwd" placeholder="Password"
           onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-signin" onclick="doLogin()">Sign in</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<script>
var currentSlug = null;
var _pass = localStorage.getItem('admin_pass') || '';

// ── Multi-language state ─────────────────────────────────
var _langs = ['en'];
var _editorLang = 'en';
var _mlStore = {}; // { en: {id: value}, ru: {id: value} }
var _selectedTemplate = 'default';
var _loadedRawData = null; // stores original JSON for demo projects

// Template definitions (mirrored from generate.js)
var TEMPLATES = {
  'default':            { name: 'Tranio Classic',       desc: 'Teal & cream, clean and professional',    primary: '#2F5050', accent: '#BFA177', bg: '#F2EDE6' },
  'anchan-indigo':      { name: 'Anchan Indigo',        desc: 'Indigo & gold, elegant luxury',           primary: '#2C3E6B', accent: '#C9A96E', bg: '#F5F2ED' },
  'angsana-oceanview':  { name: 'Angsana Oceanview',    desc: 'Navy blue & gold, premium resort',        primary: '#0b1a2e', accent: '#c9a96e', bg: '#f5f2ed' },
  'asi-village':        { name: 'Asi Village',           desc: 'Forest green & gold, eco-luxury',         primary: '#1a3c34', accent: '#c9a96e', bg: '#efeae0' },
  'arise-vibe':         { name: 'Arise Vibe',           desc: 'Dark green & gold, modern tropical',      primary: '#1a3a2a', accent: '#c8a96e', bg: '#f0eeeb' },
  'annara':             { name: 'Annara',                desc: 'Sage green & sand, warm sophistication',  primary: '#5a7a64', accent: '#c8a96e', bg: '#f5f0e8' }
};

function selectTemplate(id) {
  _selectedTemplate = id;
  document.querySelectorAll('.template-card').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tmpl === id);
  });
}

function buildTemplatePicker() {
  var html = '<div class="template-picker"><div class="template-picker__title">Design Template</div><div class="template-picker__grid">';
  Object.keys(TEMPLATES).forEach(function(id) {
    var t = TEMPLATES[id];
    var active = id === _selectedTemplate ? ' active' : '';
    html += '<div class="template-card' + active + '" data-tmpl="' + id + '" onclick="selectTemplate(\'' + id + '\')">'
      + '<div class="template-card__swatches">'
      + '<div class="template-card__swatch" style="background:' + t.primary + '"></div>'
      + '<div class="template-card__swatch" style="background:' + t.accent + '"></div>'
      + '<div class="template-card__swatch" style="background:' + t.bg + '"></div>'
      + '</div>'
      + '<div class="template-card__name">' + t.name + '</div>'
      + '<div class="template-card__desc">' + t.desc + '</div>'
      + '</div>';
  });
  html += '</div></div>';
  return html;
}
var _mlSeq = 0;

function mlId() { return 'ml_' + (_mlSeq++); }

// Extract display value from possibly multi-lang val
function mlVal(val) {
  if (!val) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'object' && !Array.isArray(val)) return val[_editorLang] || val.en || Object.values(val)[0] || '';
  return String(val);
}

// Initialize _mlStore for a field from data value
function mlInit(id, val) {
  _langs.forEach(function(l) {
    if (!_mlStore[l]) _mlStore[l] = {};
    if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
      _mlStore[l][id] = val[l] || '';
    } else {
      _mlStore[l][id] = (val || '');
    }
  });
}

// Save current DOM values of all [data-ml] inputs to _mlStore
function saveMlState() {
  var els = document.querySelectorAll('[data-ml]');
  els.forEach(function(el) {
    var id = el.id;
    if (!id) return;
    if (!_mlStore[_editorLang]) _mlStore[_editorLang] = {};
    _mlStore[_editorLang][id] = el.value;
  });
}

// Load values from _mlStore into [data-ml] inputs
function loadMlState(lang) {
  var store = _mlStore[lang] || {};
  var els = document.querySelectorAll('[data-ml]');
  els.forEach(function(el) {
    var id = el.id;
    if (!id) return;
    el.value = store[id] !== undefined ? store[id] : '';
  });
}

// Switch editor language
function switchEditorLang(lang) {
  if (lang === _editorLang) return;
  saveMlState();
  _editorLang = lang;
  loadMlState(lang);
  // Update buttons
  document.querySelectorAll('.editor-lang-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

// Collect a field value: string if single lang, {en,ru} if multi
function collectMl(id) {
  if (_langs.length === 1) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }
  var obj = {};
  _langs.forEach(function(l) {
    obj[l] = (_mlStore[l] && _mlStore[l][id] !== undefined) ? _mlStore[l][id].trim() : '';
  });
  return obj;
}

// ── Auth ──────────────────────────────────────────────────
function apiFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (_pass) opts.headers['x-admin-password'] = _pass;
  return fetch(url, opts);
}

async function initAuth() {
  try {
    var r = await apiFetch('/api/projects');
    if (r.status === 401) { showLogin(); return; }
    renderProjectList(await r.json());
    loadDemos();
  } catch(e) {
    renderProjectList([]);
  }
}

function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
  setTimeout(function(){ document.getElementById('loginPwd').focus(); }, 100);
}

async function doLogin() {
  var pwd = document.getElementById('loginPwd').value;
  var errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!pwd) { errEl.textContent = 'Enter password'; return; }
  try {
    var r = await fetch('/api/projects', { headers: { 'x-admin-password': pwd } });
    if (r.status === 401) { errEl.textContent = 'Wrong password, try again'; return; }
    _pass = pwd;
    localStorage.setItem('admin_pass', pwd);
    document.getElementById('loginOverlay').style.display = 'none';

// ── Image helpers ─────────────────────────────────────────
function getImgSrc(val) {
  if (!val) return '';
  if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('//')) return val;
  var slug = (document.getElementById('f_slug') || {}).value || '';
  var fname = val.replace(/^images\//, '');
  return slug ? '/api/image/' + slug + '/' + fname : val;
}

function imgField(id, value, label, placeholder) {
  var src = value ? getImgSrc(value) : '';
  return '<div class="field">'
    + '<label>' + label + '</label>'
    + '<div class="img-input-wrap">'
    +   '<input id="' + id + '" value="' + s(value) + '" placeholder="' + s(placeholder || 'https://... or Upload') + '"'
    +   ' oninput="updateImgThumb(\'' + id + '\')" />'
    +   '<label class="btn-upload" title="Upload from file">'
    +     'Upload'
    +     '<input type="file" accept="image/*" onchange="uploadImage(\'' + id + '\',this)" />'
    +   '</label>'
    + '</div>'
    + '<div class="img-thumb' + (value ? ' visible' : '') + '" id="th_' + id + '">'
    +   '<img src="' + src + '" alt="" onerror="this.parentElement.classList.remove(\'visible\')" />'
    + '</div>'
    + '</div>';
}

function updateImgThumb(id) {
  var input = document.getElementById(id);
  var thumb = document.getElementById('th_' + id);
  if (!input || !thumb) return;
  var val = input.value.trim();
  if (val) {
    thumb.querySelector('img').src = getImgSrc(val);
    thumb.classList.add('visible');
  } else {
    thumb.classList.remove('visible');
  }
}

async function uploadImage(inputId, fileInput) {
  var file = fileInput.files[0];
  if (!file) return;
  var slug = (document.getElementById('f_slug') || {}).value.trim();
  if (!slug) { alert('Fill in Project Slug first'); fileInput.value = ''; return; }
  var input = document.getElementById(inputId);
  var orig = input.placeholder;
  input.placeholder = 'Uploading...';
  input.disabled = true;
  try {
    var b64 = await new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    var r = await apiFetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: slug, filename: file.name, data: b64 })
    });
    var json = await r.json();
    if (json.ok) {
      input.value = json.path;
      updateImgThumb(inputId);
      showStatus('Image uploaded: ' + json.path, 'ok');
    } else {
      alert('Upload failed: ' + json.error);
    }
  } catch(e) {
    alert('Upload error: ' + e.message);
  } finally {
    input.placeholder = orig;
    input.disabled = false;
    fileInput.value = '';
  }
}

// ── Collect form data ─────────────────────────────────────
function collectFormData() {
  // Save current editor lang state first
  saveMlState();

  function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function checked(id) { var el = document.getElementById(id); return el ? el.checked : false; }

  // Collect selected languages
  var langs = [];
  if (checked('lang_en')) langs.push('en');
  if (checked('lang_ru')) langs.push('ru');
  if (!langs.length) langs = ['en'];

  var heroStats = [];
  document.querySelectorAll('.hero-stat').forEach(function(row) {
    var inputs = row.querySelectorAll('input[data-ml]');
    var valId = inputs[0] ? inputs[0].id : null;
    var lblId = inputs[1] ? inputs[1].id : null;
    if(valId && (v(valId) || (_mlStore.en && _mlStore.en[valId]))) {
      heroStats.push({ value: collectMl(valId), label: collectMl(lblId) });
    }
  });

  var conceptSpecs = [];
  document.querySelectorAll('.concept-spec').forEach(function(row) {
    var inputs = row.querySelectorAll('input[data-ml]');
    var kId = inputs[0] ? inputs[0].id : null;
    var vId = inputs[1] ? inputs[1].id : null;
    if(kId && (v(kId) || (_mlStore.en && _mlStore.en[kId]))) {
      conceptSpecs.push({ key: collectMl(kId), value: collectMl(vId) });
    }
  });

  var amenities = [];
  document.querySelectorAll('.amenity-item input[data-ml]').forEach(function(inp) {
    if(inp.value.trim() || (_mlStore.en && _mlStore.en[inp.id])) amenities.push(collectMl(inp.id));
  });

  var catTags = [];
  document.querySelectorAll('.cat-tag input[data-ml]').forEach(function(inp) {
    if(inp.value.trim() || (_mlStore.en && _mlStore.en[inp.id])) catTags.push(collectMl(inp.id));
  });

  var layouts = [];
  document.querySelectorAll('.layout-card').forEach(function(card) {
    var nameInp = card.querySelector('.layout-name');
    var priceInp = card.querySelector('.layout-price');
    if(!nameInp || !nameInp.value.trim()) return;
    var specs = [];
    card.querySelectorAll('.layout-spec').forEach(function(row) {
      var si = row.querySelectorAll('input[data-ml]');
      if(si[0] && (si[0].value.trim() || (_mlStore.en && _mlStore.en[si[0].id]))) {
        specs.push({ key: collectMl(si[0].id), value: collectMl(si[1].id) });
      }
    });
    var imgInp = card.querySelector('.img-input-wrap input[id^="layout_img_"]');
    var layout = { name: collectMl(nameInp.id), price_from: collectMl(priceInp.id), specs: specs };
    if (imgInp && imgInp.value.trim()) layout.image = imgInp.value.trim();
    layouts.push(layout);
  });

  var roiRows = [];
  document.querySelectorAll('.roi-row').forEach(function(row) {
    var inputs = row.querySelectorAll('input[data-ml]');
    if(inputs[0] && (inputs[0].value.trim() || (_mlStore.en && _mlStore.en[inputs[0].id]))) {
      roiRows.push({
        type: collectMl(inputs[0].id), size: collectMl(inputs[1].id),
        price: collectMl(inputs[2].id), roi: collectMl(inputs[3].id), annual_income: collectMl(inputs[4].id)
      });
    }
  });

  var galleryImages = [];
  document.querySelectorAll('.gallery-img input[type=text],.gallery-img input:not([type]):not([accept])').forEach(function(inp) {
    if(inp.value.trim()) galleryImages.push(inp.value.trim());
  });

  var distances = [];
  document.querySelectorAll('.distance-row').forEach(function(row) {
    var inputs = row.querySelectorAll('input[data-ml]');
    if(inputs[0] && (inputs[0].value.trim() || (_mlStore.en && _mlStore.en[inputs[0].id]))) {
      distances.push({ place: collectMl(inputs[0].id), time: collectMl(inputs[1].id) });
    }
  });

  var devFacts = [];
  document.querySelectorAll('.dev-fact').forEach(function(row) {
    var inputs = row.querySelectorAll('input[data-ml]');
    if(inputs[0] && (inputs[0].value.trim() || (_mlStore.en && _mlStore.en[inputs[0].id]))) {
      devFacts.push({ key: collectMl(inputs[0].id), value: collectMl(inputs[1].id) });
    }
  });

  var paragraphs = [];
  document.querySelectorAll('.concept-para textarea[data-ml]').forEach(function(ta) {
    if(ta.value.trim() || (_mlStore.en && _mlStore.en[ta.id])) paragraphs.push(collectMl(ta.id));
  });

  // Collect form fields
  var formFields = [];
  document.querySelectorAll('.ff-item').forEach(function(row) {
    var nameInp = row.querySelector('.ff-name');
    var typeInp = row.querySelector('.ff-type');
    var phInp = row.querySelector('.ff-placeholder');
    var reqInp = row.querySelector('.ff-required');
    if (nameInp && nameInp.value.trim()) {
      var ff = { name: nameInp.value.trim(), type: typeInp ? typeInp.value : 'text', required: reqInp ? reqInp.checked : false };
      if (phInp) ff.placeholder = collectMl(phInp.id);
      formFields.push(ff);
    }
  });

  return {
    project_slug: v('f_slug'),
    project_name: v('f_name'),
    template: _selectedTemplate,
    languages: langs,
    currency: v('f_currency'),
    meta_title: collectMl('f_meta_title'),
    meta_description: collectMl('f_meta_desc'),
    crm_webhook: v('f_webhook'),
    form_fields: formFields.length ? formFields : undefined,
    hero: {
      image: v('f_hero_image'),
      title: collectMl('f_hero_title'),
      description: collectMl('f_hero_desc'),
      stats: heroStats
    },
    concept: {
      title: collectMl('f_concept_title'),
      paragraphs: paragraphs,
      specs: conceptSpecs
    },
    sell_banner: {
      image: v('f_sell_image'),
      title: collectMl('f_sell_title'),
      subtitle: collectMl('f_sell_subtitle'),
      show: checked('f_sell_show')
    },
    amenities: {
      image: v('f_amenities_image'),
      title: collectMl('f_amenities_title'),
      items: amenities
    },
    catalogue: {
      image: v('f_catalogue_image'),
      tags: catTags
    },
    layouts: layouts,
    roi: { title: collectMl('f_roi_title'), rows: roiRows },
    gallery: { images: galleryImages },
    location: {
      title: collectMl('f_location_title'),
      description: collectMl('f_location_desc'),
      distances: distances,
      map_embed: v('f_map_embed')
    },
    developer: {
      image: v('f_dev_image'),
      name: collectMl('f_dev_name'),
      description: collectMl('f_dev_desc'),
      facts: devFacts
    },
    contact: {
      phone: v('f_contact_phone'),
      whatsapp: v('f_contact_whatsapp'),
      website: v('f_contact_website')
    },
    canonical_url: v('f_canonical_url')
  };
}

// ── Preview ───────────────────────────────────────────────
async function previewProject() {
  // Demo projects — navigate directly, use browser back to return
  if (_loadedRawData && currentSlug) {
    window.location.href = '/preview/' + currentSlug;
    return;
  }
  // User projects — POST data, show in iframe
  var data = collectFormData();
  // Convert relative image paths to absolute for srcdoc preview
  var slug = data.project_slug;
  function absImg(v) {
    if (!v || typeof v !== 'string') return v;
    if (v.startsWith('http://') || v.startsWith('https://') || v.startsWith('//') || v.startsWith('/')) return v;
    return slug ? '/api/image/' + slug + '/' + v.replace(/^images\//, '') : v;
  }
  if (slug) {
    if (data.hero && data.hero.image) data.hero.image = absImg(data.hero.image);
    if (data.amenities && data.amenities.image) data.amenities.image = absImg(data.amenities.image);
    if (data.developer && data.developer.image) data.developer.image = absImg(data.developer.image);
    if (data.catalogue && data.catalogue.image) data.catalogue.image = absImg(data.catalogue.image);
    if (data.sell_banner && data.sell_banner.image) data.sell_banner.image = absImg(data.sell_banner.image);
    if (data.gallery && data.gallery.images) data.gallery.images = data.gallery.images.map(absImg);
    if (data.layouts) data.layouts.forEach(function(l) { if (l.image) l.image = absImg(l.image); });
  }
  try {
    var r = await apiFetch('/api/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) { var err = await r.json(); showStatus(err.error || 'Preview error', 'err'); return; }
    var html = await r.text();
    // Add base tag so relative resources resolve correctly
    html = html.replace('<head>', '<head><base href="' + window.location.origin + '/">');
    var frame = document.getElementById('previewFrame');
    frame.style.display = 'block';
    document.getElementById('content').style.display = 'none';
    frame.srcdoc = html;
    document.getElementById('topbarTitle').textContent = '\u2190 Back  |  ' + ((document.getElementById('f_name') || {}).value || 'Preview');
    document.getElementById('topbarTitle').style.cursor = 'pointer';
    document.getElementById('topbarTitle').onclick = closePreview;
  } catch(e) { showStatus(e.message,'err'); }
}

function closePreview() {
  var frame = document.getElementById('previewFrame');
  frame.src = 'about:blank';
  frame.removeAttribute('srcdoc');
  frame.style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('topbarTitle').onclick = null;
  document.getElementById('topbarTitle').style.cursor = '';
}

// ── Deploy ────────────────────────────────────────────────
async function deployProject() {
  var data = collectFormData();
  if(!data.project_slug) { alert('Fill in the Project Slug field first'); return; }
  var saveR = await apiFetch('/api/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  if (saveR.status === 401) { showLogin(); return; }
  var saveData = await saveR.json();
  if(!saveData.ok) { showStatus('Save failed: ' + saveData.error, 'err'); return; }

  var btn = document.getElementById('deployBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Deploying...';
  showStatus('Deploying to Cloudflare Pages...', 'info');

  try {
    var r = await apiFetch('/api/deploy', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ slug: data.project_slug }) });
    if (r.status === 401) { showLogin(); return; }
    var res = await r.json();
    if(res.ok) {
      showStatus('Deployed!', 'ok');
      var result = document.getElementById('deployResult');
      result.style.display = 'block';
      var links = '<a href="' + res.deployUrl + '" target="_blank">' + res.deployUrl + '</a>';
      if (res.pagesUrl && res.pagesUrl !== res.deployUrl) {
        links += '<br><a href="' + res.pagesUrl + '" target="_blank">' + res.pagesUrl + '</a>';
      }
      if (res.domain) {
        if (res.domain.dnsConfigured) {
          links += '<br><span style="color:#16a34a">✓ Domain + DNS configured: ' + s(res.domain.domain) + '</span>';
        } else if (res.domain.instructions) {
          links += '<br><span style="color:#d97706">⚠ ' + s(res.domain.instructions) + '</span>';
        }
      }
      document.getElementById('deployLinks').innerHTML = links;
    } else {
      showStatus('Deploy failed: ' + res.error, 'err');
    }
  } catch(e) { showStatus('Deploy error: ' + e.message, 'err'); }
  btn.disabled = false;
  btn.innerHTML = 'Deploy';
}

function showStatus(msg, type) {
  var s = document.getElementById('formStatus');
  if(!s) return;
  s.textContent = msg;
  s.className = 'status show status-' + type;
  setTimeout(function(){ s.classList.remove('show'); }, 5000);
}

// ── Language checkbox change handler ──────────────────────
function onLangChange() {
  saveMlState();
  var newLangs = [];
  if (document.getElementById('lang_en') && document.getElementById('lang_en').checked) newLangs.push('en');
  if (document.getElementById('lang_ru') && document.getElementById('lang_ru').checked) newLangs.push('ru');
  if (!newLangs.length) { newLangs = ['en']; document.getElementById('lang_en').checked = true; }
  _langs = newLangs;
  // Ensure _mlStore has entries for all langs
  _langs.forEach(function(l) { if (!_mlStore[l]) _mlStore[l] = {}; });
  // If current editor lang not in _langs, switch
  if (_langs.indexOf(_editorLang) === -1) {
    _editorLang = _langs[0];
    loadMlState(_editorLang);
  }
  // Show/hide lang switcher bar
  var bar = document.getElementById('editorLangBar');
  if (bar) {
    if (_langs.length > 1) {
      bar.style.display = 'flex';
      bar.innerHTML = '<span class="editor-lang-bar__label">Editing language:</span>'
        + '<div class="editor-lang-bar__btns">'
        + _langs.map(function(l) { return '<button type="button" class="editor-lang-btn' + (l === _editorLang ? ' active' : '') + '" data-lang="' + l + '" onclick="switchEditorLang(\'' + l + '\')">' + l.toUpperCase() + '</button>'; }).join('')
        + '</div>';
    } else {
      bar.style.display = 'none';
    }
  }
}

    + '<span class="section-card__chevron">&#9660;</span></div>'
    + '<div class="section-card__body">'
    + '<p style="font-size:12px;color:#6b7280;margin-bottom:8px">Customize form fields on the landing page. Leave empty for defaults (Name, Phone, Email).</p>'
    + '<div class="dyn-list" id="formFieldsList">'
    + (formFields.length ? formFields : []).map(function(ff) {
        var phId = mlId();
        mlInit(phId, ff.placeholder || '');
        return '<div class="dyn-item ff-item"><div class="ff-row">'
          + '<input class="ff-name" value="' + s(ff.name) + '" placeholder="Field name" />'
          + '<select class="ff-type"><option value="text"' + (ff.type==='text'?' selected':'') + '>Text</option><option value="email"' + (ff.type==='email'?' selected':'') + '>Email</option><option value="tel"' + (ff.type==='tel'?' selected':'') + '>Phone</option></select>'
          + '<input id="' + phId + '" class="ff-placeholder" data-ml value="' + s(mlVal(ff.placeholder || '')) + '" placeholder="Placeholder text" />'
          + '<label><input type="checkbox" class="ff-required"' + (ff.required ? ' checked' : '') + ' /> Req</label>'
          + '<button class="btn-rm" onclick="removeItem(this)">x</button>'
          + '</div></div>';
      }).join('')
    + '</div>'
    + '<button class="btn-add" onclick="addFormField()">+ Add field</button>'
    + '</div></div>'

    + '</div><!-- /form-sections -->'

    // Deploy result
    + '<div class="deploy-result" id="deployResult">'
    + '<h4>Deployed successfully!</h4>'
    + '<div id="deployLinks"></div>'
    + '</div>';
}

// ── Helper: safe string ───────────────────────────────────
function s(v) {
  if(v === null || v === undefined) return '';
  if(typeof v === 'object') return s(mlVal(v));
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── AI Fill ───────────────────────────────────────────────
async function aiFill() {
  var query = document.getElementById('aiQuery').value.trim();
  if (!query) { alert('Enter a project name or URL'); return; }

  // Collect current languages
  var langs = [];
  var langEn = document.getElementById('lang_en');
  var langRu = document.getElementById('lang_ru');
  if (langEn && langEn.checked) langs.push('en');
  if (langRu && langRu.checked) langs.push('ru');
  if (!langs.length) langs = ['en'];

  var btn = document.getElementById('aiFillBtn');
  var status = document.getElementById('aiStatus');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>Searching...';
  status.textContent = 'Claude is searching the web and filling the form...';

  try {
    var r = await apiFetch('/api/ai-fill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, languages: langs })
    });
    if (r.status === 401) { showLogin(); return; }
    var res = await r.json();
    if (res.ok && res.data) {
      currentSlug = res.data.project_slug || null;
      _langs = res.data.languages || langs;
      _editorLang = _langs[0];
      _mlStore = {};
      _mlSeq = 0;
      renderForm(res.data);
      document.getElementById('topbarTitle').textContent = res.data.project_name || 'AI Generated';
      document.getElementById('topbarActions').style.display = 'flex';
      showStatus('AI filled the form! Review and edit as needed.', 'ok');
      status.textContent = '';
    } else {
      showStatus('AI error: ' + (res.error || 'Unknown error'), 'err');
      status.textContent = 'Error - try again';
    }
  } catch(e) {
    showStatus('AI error: ' + e.message, 'err');
    status.textContent = 'Error - try again';
  }
  btn.disabled = false;
  btn.innerHTML = 'AI Fill';
}

// ── Drive Image Import ────────────────────────────────────
function openDriveImport() {
  var overlay = document.createElement('div');
  overlay.className = 'drive-modal-overlay';
  overlay.id = 'driveModal';
  overlay.innerHTML = '<div class="drive-modal">'
    + '<h3>Import Images from Google Drive</h3>'
    + '<p>Share a Google Drive folder publicly, paste the link below. Name files by convention and they\'ll auto-fill the right fields.</p>'
    + '<div class="naming-guide">'
    + '<h4>Naming Convention</h4>'
    + '<table>'
    + '<tr><td>hero.jpg</td><td>Main hero banner (1920×1080)</td></tr>'
    + '<tr><td>concept.jpg</td><td>Concept section image</td></tr>'
    + '<tr><td>amenities.jpg</td><td>Amenities background</td></tr>'
    + '<tr><td>catalogue.jpg</td><td>Catalogue section</td></tr>'
    + '<tr><td>developer.jpg</td><td>Developer photo</td></tr>'
    + '<tr><td>sell.jpg / banner.jpg</td><td>Sell banner background</td></tr>'
    + '<tr><td>layout-1.jpg, layout-2.jpg ...</td><td>Floor plans</td></tr>'
    + '<tr><td>gallery-1.jpg, gallery-2.jpg ...</td><td>Gallery photos</td></tr>'
    + '<tr><td>Anything else</td><td>→ goes to Gallery</td></tr>'
    + '</table>'
    + '</div>'
    + '<div class="field">'
    + '<label>Google Drive Folder Link</label>'
    + '<input id="driveUrl" placeholder="https://drive.google.com/drive/folders/..." />'
    + '</div>'
    + '<div id="driveResult"></div>'
    + '<div class="btn-row">'
    + '<button class="btn-cancel" onclick="closeDriveModal()">Cancel</button>'
    + '<button class="btn-drive" id="driveFetchBtn" onclick="fetchDriveImages()">Fetch Images</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeDriveModal(); });
  setTimeout(function() { document.getElementById('driveUrl').focus(); }, 100);
}

function closeDriveModal() {
  var m = document.getElementById('driveModal');
  if (m) m.remove();
}

async function fetchDriveImages() {
  var url = document.getElementById('driveUrl').value.trim();
  if (!url) { alert('Paste a Google Drive folder link'); return; }

  var btn = document.getElementById('driveFetchBtn');
  var result = document.getElementById('driveResult');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>Loading...';
  result.innerHTML = '';

  try {
    var r = await apiFetch('/api/drive-import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder_url: url })
    });
    if (r.status === 401) { showLogin(); closeDriveModal(); return; }
    var res = await r.json();
    if (!res.ok) throw new Error(res.error || 'Unknown error');

    var mapping = res.mapping;
    var html = '<div class="result-box"><strong>' + res.total_files + ' images found:</strong><br><br>';

    // Show what will be mapped
    var roleLabels = {
      hero_image: 'Hero', concept_image: 'Concept', amenities_image: 'Amenities',
      catalogue_image: 'Catalogue', developer_image: 'Developer', sell_image: 'Sell Banner'
    };
    for (var key in roleLabels) {
      if (mapping[key]) {
        html += '<div class="result-item"><span class="role">' + roleLabels[key] + '</span>'
          + '<img src="' + mapping[key] + '" onerror="this.style.display=\'none\'" />'
          + '<span class="fname">' + key + '</span></div>';
      }
    }
    if (mapping.layouts && mapping.layouts.length) {
      html += '<div class="result-item"><span class="role">Layouts (' + mapping.layouts.length + ')</span>'
        + '<span class="fname">' + mapping.layouts.length + ' floor plan(s)</span></div>';
    }
    if (mapping.gallery && mapping.gallery.length) {
      html += '<div class="result-item"><span class="role">Gallery (' + mapping.gallery.length + ')</span>'
        + '<span class="fname">' + mapping.gallery.length + ' photo(s)</span></div>';
    }
    html += '</div>';
    result.innerHTML = html;

    // Change button to Apply
    btn.innerHTML = 'Apply to Form';
    btn.disabled = false;
    btn.onclick = function() { applyDriveImages(mapping); };

  } catch(e) {
    result.innerHTML = '<div class="result-box error">' + e.message + '</div>';
    btn.disabled = false;
    btn.innerHTML = 'Fetch Images';
  }
}

function applyDriveImages(mapping) {
  // Hero
  if (mapping.hero_image) {
    var heroInp = document.getElementById('f_hero_image');
    if (heroInp) { heroInp.value = mapping.hero_image; updateImgThumb('f_hero_image'); }
  }
  // Concept — there's no separate concept image field in current editor, skip or use amenities
  if (mapping.amenities_image) {
    var amenInp = document.getElementById('f_amenities_image');
    if (amenInp) { amenInp.value = mapping.amenities_image; updateImgThumb('f_amenities_image'); }
  }
  if (mapping.catalogue_image) {
    var catInp = document.getElementById('f_catalogue_image');
    if (catInp) { catInp.value = mapping.catalogue_image; updateImgThumb('f_catalogue_image'); }
  }
  if (mapping.developer_image) {
    var devInp = document.getElementById('f_dev_image');
    if (devInp) { devInp.value = mapping.developer_image; updateImgThumb('f_dev_image'); }
  }
  if (mapping.sell_image) {
    var sellInp = document.getElementById('f_sell_image');
    if (sellInp) { sellInp.value = mapping.sell_image; updateImgThumb('f_sell_image'); }
  }

  // Layouts — fill existing layout image fields or create new ones
  if (mapping.layouts && mapping.layouts.length) {
    var layoutCards = document.querySelectorAll('.layout-card');
    mapping.layouts.forEach(function(url, i) {
      var inp = document.querySelector('#layout_img_' + i) || (layoutCards[i] && layoutCards[i].querySelector('.img-input-wrap input'));
      if (inp) { inp.value = url; var id = inp.id; if (id) updateImgThumb(id); }
    });
  }

  // Gallery — fill existing gallery inputs, add more if needed
  if (mapping.gallery && mapping.gallery.length) {
    var container = document.getElementById('galleryImages');
    if (container) {
      var existing = container.querySelectorAll('.dyn-item input[id^="gimg_"]');
      mapping.gallery.forEach(function(url, i) {
        if (i < existing.length) {
          existing[i].value = url;
          updateImgThumb(existing[i].id);
        } else {
          addGalleryImg();
          var newInputs = container.querySelectorAll('.dyn-item input[id^="gimg_"]');
          var last = newInputs[newInputs.length - 1];
          if (last) { last.value = url; updateImgThumb(last.id); }
        }
      });
    }
  }

  closeDriveModal();
  showStatus('Images imported from Google Drive! ' + Object.keys(mapping).length + ' fields filled.', 'ok');
}

initAuth();
</script>
